plan:
  objective: "交付 Seedance 節點式提示詞工作台與安全的 Ark 非同步生成垂直切片"
  tasks:
    - id: T1
      task: "建立獨立子專案 Walking Skeleton"
      output: "可啟動的單頁工作台與基本節點畫布"
      verify: "npm run dev 或 npm run build 成功"
      status: completed
    - id: T2
      task: "完成節點編輯與提示詞組裝"
      output: "節點操作、四拍預覽、提示詞複製與 JSON 匯出"
      verify: "瀏覽器實際操作主流程"
      status: completed
    - id: T3
      task: "補齊本地儲存、響應式與錯誤狀態"
      output: "重新整理可還原、手機版可用、空值有明確處理"
      verify: "聚焦測試與手動驗收"
      status: completed
    - id: T4
      task: "更新驗收、Baseline 與下一功能評估"
      output: ".agent/acceptance、baseline、next-feature"
      verify: "npm run lint、npm run build、npm test 與瀏覽器驗收"
      status: completed
    - id: T5
      task: "接入 Ark 本機代理、生成輪詢與版本歷史"
      output: "API 設定、生成影片入口、v001 版次歷史與安全錯誤狀態"
      verify: "adapter/proxy tests、本機 health、瀏覽器入口；真實供應商需 MANUAL_REQUIRED"
      status: completed
    - id: T6
      task: "強化生成任務可靠性與輸入資料驗證"
      output: "timeout、retry、cancel、structured errors、history controls、workflow bounds"
      verify: "13 tests、本機 mock cancellation/retry、上層主站 gates"
      status: completed
    - id: T7
      task: "加入參考資產預覽、HTTPS image payload 與尾幀接續"
      output: "Asset 節點、圖片 URL 驗證、本機預覽、歷史尾幀回填"
      verify: "adapter payload tests、瀏覽器 mock 產生後回填下一段、不得把本機檔案假裝成可公開 URL"
      status: completed
    - id: T8
      task: "加入本機用量護欄與 API bridge 部署就緒資訊"
      output: "送出前費用確認、每日任務／秒數上限、可追溯護欄快照與 health limits"
      verify: "policy 單元測試、health 整合測試、瀏覽器實際設定與送出前確認"
      status: completed
    - id: T9
      task: "加入 API bridge 的 production preflight 與 Origin／rate limit 邊界"
      output: "可配置 bind host、HTTPS allowlist、Origin 強制檢查、每分鐘限流與 strict preflight"
      verify: "bridge policy tests、API 403／429／CORS 整合測試、preflight strict ready/not-ready"
      status: completed
    - id: T10
      task: "完成第 2 階段可發布驗證與部署包裝"
      output: "release check、產物 SHA-256 manifest、.env.example 與平台無關部署檢查"
      verify: "release-check tests、strict ready/not-ready、build 後產物與上層主站回歸"
      status: completed
    - id: T11
      task: "完成第 3 階段影片版本歷史封存與匯入"
      output: "可攜式版本歷史 JSON archive、匯出／匯入 UI、格式驗證與合併策略"
      verify: "archive 單元測試、lint/build、瀏覽器下載與匯入錯誤流程"
      status: completed
