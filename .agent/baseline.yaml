baseline:
  id: BASELINE-20260802-009
  status: passed_with_manual_gate
  accepted_features:
    - "Seedance Flow 節點式工作台"
    - "節點新增、選取、拖曳、刪除與 Inspector 欄位編輯"
    - "四拍 30 秒 Seedance 2.5 提示詞組裝"
    - "複製 fallback、TXT／JSON 匯出與 localStorage 還原"
    - "桌面與 390px 手機響應式版面"
    - "Ark 本機代理建立／查詢非同步生成任務"
    - "提示詞與影片 URL 的 v001、v002…版次歷史"
    - "生成逾時、重試退避、取消任務與失敗重試入口"
    - "工作流匯入的大小、節點類型、ID 與欄位驗證"
    - "Reference 節點可輸入最多 3 個 Ark 可存取的 HTTPS 參考圖片"
    - "本機圖片只提供預覽，不會偽裝成可公開 URL 送往 Ark"
    - "完成版本保存尾幀並可回填為下一段的首幀參考"
    - "本機用量護欄可限制單次時長、每日任務數與每日總秒數"
    - "送出前可要求費用不確定性與當日用量確認，歷史保存護欄快照"
    - "API health 回報 upstream 模式與部署 limits，不暴露金鑰"
    - "API bridge 支援 HTTPS Origin allowlist、Origin 強制檢查與每分鐘速率限制"
    - "production preflight 可阻擋未設定 upstream、bind host、Origin 與 HTTPS allowlist 的部署"
    - "release:check 可驗證 dist 核心產物並輸出 SHA-256 manifest"
    - "release:check:strict 可將 production bridge preflight 與產物完整性納入發布 gate"
    - ".env.example 提供平台無關設定模板且不含任何秘密"
    - "影片版本可匯出為 schemaVersion=1 的本機 JSON archive，也可驗證後匯入"
    - "版本 archive 使用欄位白名單排除 API Key，限制 40 筆／2 MB 並依 id 去重合併"
    - "版本歷史可依版次、提示詞、模型、task／request／error 摘要搜尋"
    - "版本歷史可依 queued／running／succeeded／failed 等狀態篩選，顯示結果計數與空結果訊息"
  critical_user_flows:
    - "載入預設工作流並查看提示詞"
    - "新增節點、編輯欄位、提示即時更新"
    - "拖曳節點、重新整理後狀態保留"
    - "下載 JSON 工作流與 TXT 提示詞"
    - "API 設定不落盤，生成歷史可在本機查看任務狀態"
    - "設定用量護欄、確認付費風險後送出 mock 生成，重新整理後護欄與歷史仍保留"
  protected_behavior:
    - "上層譯匠主站檔案與 .openai/hosting.json 不變"
    - "上層 npm run lint、npm run build、npm test 通過"
    - "API Key 只由目前分頁經本機代理傳送，不落盤、不回傳；工作流與版本歷史仍為瀏覽器 localStorage"
  public_interfaces:
    - "moviedesign 本地 dev server 入口"
    - "schemaVersion=1 的 JSON 工作流匯出"
  data_compatibility:
    - "localStorage keys seedance-flow-workflow-v1、seedance-flow-history-v1（不含 API Key）"
  environment:
    - "Windows PowerShell"
    - "Node.js 24.15.0"
    - "agent-browser Chromium 390x844 與 1440x900"
  known_limitations:
    - "真實 Ark 影片生成尚待有效 API Key、模型／Endpoint ID 與費用確認（MANUAL_REQUIRED）"
    - "正式 bridge 部署、DNS、TLS、監控與費用／配額尚待專案負責人確認（MANUAL_REQUIRED）"
    - "版本 archive 目前只在使用者手動下載／選取檔案時跨瀏覽器搬移，不提供雲端同步"
    - "瀏覽器若拒絕剪貼簿權限，需手動 Ctrl/Cmd+C"
  evidence:
    - ".agent/acceptance/CHANGE-001-acceptance.yaml"
    - ".agent/acceptance/CHANGE-002-acceptance.yaml"
    - ".agent/acceptance/CHANGE-003-acceptance.yaml"
    - ".agent/acceptance/CHANGE-004-acceptance.yaml"
    - ".agent/acceptance/CHANGE-005-acceptance.yaml"
    - ".agent/acceptance/CHANGE-006-acceptance.yaml"
    - ".agent/acceptance/CHANGE-007-acceptance.yaml"
    - ".agent/acceptance/CHANGE-008-acceptance.yaml"
    - ".agent/acceptance/CHANGE-009-acceptance.yaml"
